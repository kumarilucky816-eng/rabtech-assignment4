<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RabTech Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>RabTech Dashboard</h1>
    <button id="themeBtn">Dark / Light</button>
  </header>

  <main class="grid">
    <div class="card"><h2>Overview</h2><p>Welcome to my dashboard.</p></div>
    <div class="card"><h2>Tasks</h2><p>6 tasks pending.</p></div>
    <div class="card"><h2>Documents</h2><p>Upload your files here.</p></div>
    <div class="card"><h2>ID Card</h2><p>View your student ID.</p></div>
    <div class="card"><h2>Referrals</h2><p>Invite your friends.</p></div>
    <div class="card"><h2>Profile</h2><p>Lucky Kumari</p></div>
  </main>

  <script>
    document.getElementById("themeBtn").onclick = function () {
      var t = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", t === "dark" ? "light" : "dark");
    };
  </script>
</body>
</html>
